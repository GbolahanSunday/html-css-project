<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div Element</title>
</head>

<style>
    .square-red {
        width: 5px;
    background-color: rgb(250, 0, 0);
    padding: 30px;
    margin-bottom: 15px;
}
.round-green {
        width: 5px;
        border-radius: 30px;
    background-color: green;
    padding: 30px;
    margin-bottom: 20px;
}

.services {
    width: 300px;
    border: 1px solid grey;
    font-family: Arial;
    font-size: 15px;
}

.services p {
    padding-left: 15px;
}

.services button {
    margin-bottom: 15px;
}

.services .yes {
    margin-left: 15px;
}

.install-box {
    background-color: black;
    color: white;
    width: 300px;
    font-family: Arial;
}

.install-box .title {
    font-weight: bold;
    padding-left: 10px;
    padding-top: 15px;
    padding-bottom: 0;
}

.install-box .sub-title {
    font-size: 12px;
    padding-left: 10px;
    padding-bottom: 15px;
    color: rgb(177, 175, 175);
}

</style>

<body>

    <div class="square-red"></div>
     <div class="round-green"></div>
     
     <div class="services">
        <p>Satisfied with our service?</p>
        <button class="yes">Yes</button>
        <button class="no">No</button>
     </div>

     <div class="install-box">
        <p class="title">
            Install YouTube Music
        </p>
        <p class="sub-title">
            Add YouTube Music to your desktop for quick and easy access
        </p>
     </div>
    
</body>
</html>
