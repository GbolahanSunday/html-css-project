<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div Element</title>
</head>

<style>
    .square-red {
        width: 5px;
    background-color: rgb(250, 0, 0);
    padding: 30px;
    margin-bottom: 15px;
}
.round-green {
        width: 5px;
        border-radius: 30px;
    background-color: green;
    padding: 30px;
    margin-bottom: 20px;
}

.services {
    width: 300px;
    border: 1px solid grey;
    font-family: Arial;
    font-size: 15px;
}

.services p {
    padding-left: 15px;
}

.services button {
    margin-bottom: 15px;
}

.services .yes {
    margin-left: 15px;
}

.install-box {
    background-color: black;
    color: white;
    width: 300px;
    font-family: Arial;
}

.install-box .title {
    font-weight: bold;
    padding-left: 10px;
    padding-top: 15px;
    padding-bottom: 0;
}

.install-box .sub-title {
    font-size: 12px;
    padding-left: 10px;
    padding-bottom: 15px;
    color: rgb(177, 175, 175);
}

.tweet {
    font-family: Arial;
    font-size: 13px;
    width: 335px;
    padding: 5px;
    margin-top: 20px;
    border-radius: 5px;
    box-shadow: 2px 1px 5px 1px grey;
}

.tweet .img-cat {
    width:40px;
    height: 40px;
    border-radius: 30px;
    display: inline-block;
    margin-top: 5px;
}

.tweet p {
    display: inline-block;
    vertical-align: top;
    padding-left: 5px;
    padding-right: 60px;
}

.tweet button {
    background-color: rgb(4, 106, 248);
    color: white;
    border-style: none;
    padding: 8px 14px 8px 14px;
    vertical-align: top;
    margin-top: 10px;
    margin-left: 30px;
    border-radius: 20px;
}

.cart {
    width: 150px;
    margin-top: 20px;
    box-shadow: 1px 4px 6px 2px rgb(182, 180, 180);
    font-family: Arial;
}

.image-cat {
    width: 150px;
}

.cat-name {
    font-weight: bold;
    padding-left: 5px;
    margin-top: 5px;
    margin-bottom: 0;
}

.friends {
    font-size: 12px;
    margin-top: 3px;
    margin-bottom: 0;
    padding-left: 5px;
    color: rgb(108, 106, 106);
}

.add-button {
    background-color: rgb(4, 106, 248);
    color: white;
    border-style: none;
    margin-top: 10px;
    margin-bottom: 5px;
    margin-left: 5px;
    font-size: 10px;
    padding-top: 5px;
    padding-bottom: 5px;
    padding-left: 10px;
    padding-right: 10px;
}

.cart {
    width: 150px;
    margin-top: 20px;
    box-shadow: 1px 4px 6px 2px rgb(182, 180, 180);
    font-family: Arial;
}

.image-cat2 {
    width: 150px;
    display: inline-block;
}

.cat2-name {
    font-weight: bold;
    padding-left: 5px;
    margin-top: 5px;
    margin-bottom: 0;
}

.image-dog {
    width: 150px;
}

.dog-name {
    font-weight: bold;
    padding-left: 5px;
    margin-top: 5px;
    margin-bottom: 0;
}

.cart {
    width: 150px;
    margin-top: 20px;
    box-shadow: 1px 4px 6px 2px rgb(182, 180, 180);
    font-family: Arial;
    display: inline-block;
    margin-right: 10px;
}

.image-goat {
    width: 150px;
}

.goat-name {
    font-weight: bold;
    padding-left: 5px;
    margin-top: 5px;
    margin-bottom: 0;
}


</style>

<body>

    <div class="square-red"></div>
     <div class="round-green"></div>
     
     <div class="services">
        <p>Satisfied with our service?</p>
        <button class="yes">Yes</button>
        <button class="no">No</button>
     </div>

     <div class="install-box">
        <p class="title">
            Install YouTube Music
        </p>
        <p class="sub-title">
            Add YouTube Music to your desktop for quick and easy access
        </p>
     </div>

     <div class="tweet">
        <img class="img-cat" src="thumbnails/cat2.jpg" alt="">
        <p>What's happening?</p>
        <button>Tweet</button>
     </div>

     <div class="cart">
        <img class="image-cat" src="thumbnails/cat2.jpg" alt="">
        <p class="cat-name">
            Oliver
        </p>
        <p class="friends">
            2 mutual friends
        </p>
        <button class="add-button">
            Add Friend
        </button>
     </div>

     <div class="container">

        <div class="cart">
        <img class="image-cat2" src="thumbnails/cat2.jpg" alt="">
        <p class="cat2-name">
            Oliver
        </p>
        <p class="friends">
            2 mutual friends
        </p>
        <button class="add-button">
            Add Friend
        </button>
     </div>
     <div class="cart">
        <img class="image-dog" src="thumbnails/dog.jpg" alt="">
        <p class="dog-name">
            Dog
        </p>
        <p class="friends">
            3 mutual friends
        </p>
        <button class="add-button">
            Add Friend
        </button>
     </div>
<div class="cart">
        <img class="image-goat" src="thumbnails/goat.jpg" alt="">
        <p class="goat-name">
            Goat
        </p>
        <p class="friends">
            2 mutual friends
        </p>
        <button class="add-button">
            Add Friend
        </button>
     </div>



     </div>
    
</body>
</html>
