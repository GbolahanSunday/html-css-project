<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image and text box exercise</title>
</head>
<style>
    .image1 {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        overflow: hidden;
        margin-bottom: 20px;
    }

    .img1 {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top;
    }

    .img2 {
        width: 200px;
        height: 200px;
        margin-bottom: 15px;
    }

    .image3 {
        width: 280px;
        height: 200px;
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 20px;
    }
    .img3 {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top;
    }

</style>
<body>
    <div class="image1">
        <img class="img1" src="thumbnails/cat.jpg" alt="">
    </div>
    <div class="image2">
        <img class="img2" src="thumbnails/cat.jpg" alt="">
    </div>
    <div class="image3">
        <img class="img3" src="thumbnails/cat.jpg" alt="">
    </div>

</body>
</html>
