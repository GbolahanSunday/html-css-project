<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image and text box exercise</title>
</head>
<style>
    .image1 {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        overflow: hidden;
        margin-bottom: 20px;
    }

    .img1 {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top;
    }

    .img2 {
        width: 200px;
        height: 200px;
        margin-bottom: 15px;
    }

    .image3 {
        width: 280px;
        height: 200px;
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 20px;
    }
    .img3 {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top;
    }

</style>
<body>
    <div class="image1">
        <img class="img1" src="thumbnails/cat.jpg" alt="">
    </div>
    <div class="image2">
        <img class="img2" src="thumbnails/cat.jpg" alt="">
    </div>
    <div class="image3">
        <img class="img3" src="thumbnails/cat.jpg" alt="">
    </div>

    
<!--Create a text box-->

<div class="r-corners">
    <input class="search-bar" type="text" placeholder="Search">
</div>

<div class="google-search">
    <input class="g-search" type="text" placeholder="Search Google or type a URL">
</div>

<div class="Linkedin-sign">
    <p class="email-text">Email</p>
    <input class="email" type="text" placeholder="">
    <p class="click">By clicking Agree & Join, you agree to the Privacy Policy</p>
    <button class="btn">Agree & Join</button>
</div>

<!--Twitter text box-->

<div class="twitter">
    <div class="image">
        <img class="img" src="thumbnails/cat.jpg" alt="">
    </div>
     <p>What's happening?</p>
     <button class="btn-tweet">Tweet</button>
</div>

<style>
    .search-bar {
        font-size: 15px;
        padding: 8px;
        border-radius: 5px;
        border-style: solid;
        border-color: rgba(220, 216, 216, 0.979);
        border-width: 1px;
        color: rgba(220, 216, 216, 0.979);
    }

    .google-search {
        margin-top: 15px;
    }

    .g-search {
        padding: 10px;
        width: 400px;
        border: none;    
        border-color: rgba(219, 215, 215, 0.979);
        box-shadow: 1px 0.5px 1px 2px rgb(238, 236, 234);
        border-radius: 20px;
        color: rgb(235, 231, 231);
        font-size: 13px;
    }

    .Linkedin-sign {
        font-family: Arial;
        font-size: 13px;
        width: 325px;
        color: rgb(109, 108, 108);
    }
    .Linkedin-sign .email-text {
        margin-bottom: 5px;
    }
    .Linkedin-sign .email {
        width: 320px;
        height: 20px;
    }

    .Linkedin-sign .click {
        text-align: center;
    }

    .Linkedin-sign .btn {
        background-color: rgb(16, 110, 241);
        color: white;
        font-size: 15px;
        width: 320px;
        height: 40px;
        text-align: center;
        border-style: none;
        border-radius: 20px;
        cursor: pointer;
        margin-bottom: 30px;
    }

    .twitter .image {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        overflow: hidden;
        margin-bottom: 20px;
        margin-right: 10px;
    }

    .twitter .img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top;
    }

    .twitter {
        display: flex;
        font-family: Arial;
        color: rgb(109, 108, 108);
        text-align: center;
    }

    .twitter p {
        margin-right: 100px;
    }

    .twitter .btn-tweet {
        width: 55px;
        height: 30px;
        background-color: rgb(16, 110, 241);
        color: white;
        border-style: none;
        border-radius: 20px;
    }


</style>

</body>
</html>
